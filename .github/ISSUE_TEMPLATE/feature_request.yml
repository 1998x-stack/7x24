name: Feature request
description: Propose a focused enhancement with an acceptance criterion.
title: "[feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem and motivation
      description: Describe the workflow that is blocked, not just the implementation idea.
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Likely module
      options:
        - domain
        - application
        - infrastructure
        - interfaces
        - uncertain
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance criteria
    validations:
      required: true
