name: News24 CI - Modular Architecture

permissions:
  contents: read

on:
  push:
    branches: ["main", "refactor/**", "feat/**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Syntax check
        run: python -m compileall -q src/news24
      - name: JS static syntax check
        run: node --check src/news24/interfaces/web/app.js
      - name: Ruff
        run: python -m ruff check src/news24 tests/unit tests/contract tests/integration tests/architecture
      - name: Mypy
        run: python -m mypy src/news24
      - name: Unit, contract, integration and legacy tests
        run: python -m pytest -q tests/unit tests/contract tests/integration tests/architecture tests/legacy/test_system.py
      - name: Offline CLI smoke
        run: |
          python -m news24 doctor --json
          python -m news24 test-fixtures tests/fixtures/sina/feed_success.json
          python -m news24 db migrate --db /tmp/news24-ci.sqlite3
          python -m news24 jobs status --db /tmp/news24-ci.sqlite3
          python -m news24 intelligence events --db /tmp/news24-ci.sqlite3
          python -m news24 evaluate evidence --db /tmp/news24-ci.sqlite3 --dataset tests/fixtures/intelligence/evidence_gold.json
          python -m news24 audit --db /tmp/news24-ci.sqlite3

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install browser test tools
        run: python -m pip install -e '.[dev,browser]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Real Chromium local workbench E2E
        run: python -m pytest -q tests/e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t news24:ci .
      - name: Container smoke
        run: |
          docker volume create news24-ci
          docker run --rm news24:ci doctor --json
          docker run --rm news24:ci test-fixtures /app/tests/fixtures/sina/feed_success.json
          docker run --rm -v news24-ci:/data news24:ci db migrate
          docker run --rm -v news24-ci:/data news24:ci jobs status
          docker run --rm -v news24-ci:/data news24:ci audit

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build distributable wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Validate SQL and Web packaging, no legacy files
        run: python scripts/verify_wheel.py dist
