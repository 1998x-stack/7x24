[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news24"
version = "1.0.0"
description = "Sina 7x24 research workbench with provenance and review audit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "loguru>=0.7,<1",
  "python-dotenv>=1,<2",
  "requests>=2.31,<3",
  "openai>=1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.7,<1",
  "mypy>=1.11,<2",
]
browser = ["playwright>=1.40,<2"]
graph = ["neo4j>=5,<7"]

[project.scripts]
news24 = "news24.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["news24*"]

[tool.setuptools.package-data]
"news24.storage.migrations" = ["*.sql"]
"news24.web" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/news24/**/*.py", "tests/unit/**/*.py", "tests/contract/**/*.py", "tests/integration/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
files = ["src/news24"]
