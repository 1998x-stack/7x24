services:
  news24:
    build:
      context: .
    image: news24:1.1
    init: true
    restart: "no"
    environment:
      NEWS24_DATA_DIR: /data
    volumes:
      - news24-data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    command: ["doctor", "--json"]

volumes:
  news24-data:
